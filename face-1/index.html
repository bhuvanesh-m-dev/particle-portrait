<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Portrait Assembly</title>
    <link rel="stylesheet" href="particle-portrait.css">
    
    <!-- Import Map: Tells the browser where to find Three.js without downloading it -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        <strong>Particle Portrait Assembly</strong><br>
        High-resolution reconstruction via WebGL point cloud<br>
        <span style="opacity: 0.7;">Drag to orbit · Scroll to zoom · Press SPACE to replay</span>
    </div>
    
    <!-- Load the main script as a module -->
    <script type="module" src="particle-portrait.js"></script>
</body>
</html>
